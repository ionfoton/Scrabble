<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble în Browser</title>
    <style>
        :root {
            --tw: #ff4d4d; /* Triple Word */
            --dw: #ffb3b3; /* Double Word */
            --tl: #3399ff; /* Triple Letter */
            --dl: #99ccff; /* Double Letter */
            --bg: #1e1e24;
            --board-bg: #e0d8c3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            letter-spacing: 2px;
        }

        /* Containerul Tablei */
        #board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 2px;
            width: 90vw;
            max-width: 550px;
            aspect-ratio: 1 / 1;
            background-color: #8c7853;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        /* Celulele individuale */
        .cell {
            background-color: var(--board-bg);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            color: #333;
            text-align: center;
            text-transform: uppercase;
            position: relative;
        }

        .cell.tw { background-color: var(--tw); color: white; }
        .cell.dw { background-color: var(--dw); color: #333; }
        .cell.tl { background-color: var(--tl); color: white; }
        .cell.dl { background-color: var(--dl); color: #333; }
        .cell.center { background-color: #ffcc00; color: #333; font-size: 14px; }

        /* Suportul cu litere */
        #rack {
            margin-top: 20px;
            display: flex;
            gap: 8px;
            background-color: #4a3b32;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            min-height: 42px;
            min-width: 300px;
            justify-content: center;
            align-items: center;
        }

        /* Stilul piesei cu literă */
        .tile {
            width: 40px;
            height: 40px;
            background-color: #f3e5ab;
            color: #333;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: inset 0 -3px 0 #d2b48c, 0 2px 4px rgba(0,0,0,0.4);
            cursor: grab;
            position: absolute; /* Permite suprapunerea perfectă în celulă */
            z-index: 10;
        }

        /* Când piesa este plasată pe tablă se micșorează puțin ca să încapă în celulă */
        .cell .tile {
            width: 90%;
            height: 90%;
            font-size: 14px;
            box-shadow: inset 0 -2px 0 #d2b48c, 0 1px 2px rgba(0,0,0,0.3);
        }

        .tile:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <h1>SCRABBLE</h1>
    
    <div id="board"></div>

    <div id="rack">
        <!-- Am adăugat id-uri unice și atributul draggable="true" pentru fiecare piesă -->
        <div class="tile" draggable="true" id="tile-1">A</div>
        <div class="tile" draggable="true" id="tile-2">N</div>
        <div class="tile" draggable="true" id="tile-3">A</div>
        <div class="tile" draggable="true" id="tile-4">R</div>
        <div class="tile" draggable="true" id="tile-5">E</div>
        <div class="tile" draggable="true" id="tile-6">M</div>
        <div class="tile" draggable="true" id="tile-7">E</div>
    </div>

    <script>
        const board = document.getElementById('board');
        const rack = document.getElementById('rack');

        // Pozițiile multiplicatorilor
        const TW =;
        const DW =;
        const TL =;
        const DL =;
        const CENTER = 112;

        // Generăm tabla
        for (let i = 0; i < 225; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.index = i; // Salvăm indexul celulei
            
            if (i === CENTER) { cell.classList.add('center'); cell.innerText = '★'; }
            else if (TW.includes(i)) { cell.classList.add('tw'); cell.innerText = '3W'; }
            else if (DW.includes(i)) { cell.classList.add('dw'); cell.innerText = '2W'; }
            else if (TL.includes(i)) { cell.classList.add('tl'); cell.innerText = '3L'; }
            else if (DL.includes(i)) { cell.classList.add('dl'); cell.innerText = '2L'; }

            // Evenimente pentru recepționarea piesei (Drop)
            cell.addEventListener('dragover', permiteDrop);
            cell.addEventListener('drop', plaseazaPiesa);

            board.appendChild(cell);
        }

        // Permitem suportului de jos să primească piesele înapoi dacă te răzgândești
        rack.addEventListener('dragover', permiteDrop);
        rack.addEventListener('drop', plaseazaPiesa);

        // Adăugăm evenimentul de pornire a mișcării pentru toate literele
        document.querySelectorAll('.tile').forEach(tile => {
            tile.addEventListener('dragstart', pornesteDrag);
        });

        function pornesteDrag(eveniment) {
            // Salvăm ID-ul piesei pe care o mutăm
            eveniment.dataTransfer.setData("text/plain", eveniment.target.id);
        }

        function permiteDrop(eveniment) {
            // Oprim comportamentul standard al browserului pentru a permite plasarea
            eveniment.preventDefault();
        }

        function plaseazaPiesa(eveniment) {
            eveniment.preventDefault();
            const idPiesa = eveniment.dataTransfer.getData("text/plain");
            const piesa = document.getElementById(idPiesa);
            
            // Ținta poate fi o celulă goală sau suportul de jos (rack)
            let tinta = eveniment.target;

            // Dacă jucătorul scapă piesa din greșeală peste textul din celulă (ex: '3W' sau '★')
            if (!tinta.classList.contains('cell') && tinta.id !== 'rack') {
                tinta = tinta.parentElement;
            }

            // Verificăm dacă ținta este o celulă și dacă este deja ocupată de o altă piesă
            if (tinta.classList.contains('cell') && tinta.querySelector('.tile')) {
                return; // Nu facem nimic dacă e deja ocupat
            }

            // Mutăm piesa în noua locație
            tinta.appendChild(piesa);
        }
    </script>
</body>
</html>
