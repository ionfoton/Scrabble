<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble Browser Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section class="board-panel">
            <h1 class="title">Scrabble</h1>
            <div id="board"></div>
        </section>

        <aside class="side-panel">
            <div class="card player-controls">
                <label class="label" for="player-count">Players</label>
                <select id="player-count">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4">4 Players</option>
                </select>
                <button id="new-btn" class="danger">New Game</button>
            </div>

            <div class="card scoreboard" id="player-scoreboard"></div>

            <div class="card last-move-card">
                <span id="last-move-title" class="label">LAST MOVE FOR</span>
                <div id="last-move" class="last-move-details">No move scored yet.</div>
            </div>

            <div id="rack"></div>

            <div class="buttons">
                <button id="submit-btn">Submit Move</button>
                <button id="recall-btn" class="secondary">Recall Tiles</button>
                <button id="shuffle-btn" class="secondary">Shuffle Rack</button>
                <button id="pass-btn" class="secondary">Pass Turn</button>
            </div>

            <div class="card inventory-card">
                <span class="label inventory-total">Tile inventory: <strong id="inventory-total">0</strong></span>
                <div id="tile-inventory" class="inventory-grid"></div>
            </div>
        </aside>
    </main>

    <script src="scrabble.js"></script>
</body>
</html>
