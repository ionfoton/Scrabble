<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble Browser Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section class="board-panel">
            <h1 class="title">Scrabble</h1>
            <div id="board"></div>
        </section>

        <aside class="side-panel">
            <div class="stat-grid">
                <div class="card">
                    <span class="label">Score</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="card">
                    <span class="label">Current Player</span>
                    <span class="value" id="current-player">1</span>
                </div>
                <div class="card">
                    <span class="label">Tiles Left</span>
                    <span class="value" id="tiles-left">0</span>
                </div>
                <div class="card">
                    <span class="label">Rack</span>
                    <span class="value" id="rack-count">0/7</span>
                </div>
            </div>

            <div class="card">
                <label class="label" for="player-count">Players</label>
                <select id="player-count">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4">4 Players</option>
                </select>
            </div>

            <div class="card scoreboard" id="player-scoreboard"></div>

            <div id="status" class="warn">Drag tiles from your rack onto the board.</div>

            <div id="rack"></div>

            <div class="buttons">
                <button id="submit-btn">Submit Move</button>
                <button id="recall-btn" class="secondary">Recall Tiles</button>
                <button id="shuffle-btn" class="secondary">Shuffle Rack</button>
                <button id="pass-btn" class="secondary">Pass Turn</button>
                <button id="new-btn" class="danger" style="grid-column: 1 / -1;">New Game</button>
            </div>

            <div class="card">
                <span class="label">Tile Inventory</span>
                <div id="tile-inventory" class="inventory-grid"></div>
            </div>
        </aside>
    </main>

    <script src="scrabble.js"></script>
</body>
</html>
